<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LocalPulse</title>
<meta name="theme-color" content="#1f2a5a">
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#18203f;--muted:#5b6482;--brand:#1f2a5a;--on:#fff;--sun:#f2b705;--line:#d5dbe3;--ok:#1c7c4a}
@media (prefers-color-scheme:dark){:root{--bg:#10162e;--card:#19213f;--ink:#eef1fa;--muted:#98a2c4;--brand:#f2b705;--on:#10162e;--line:#2b3560;--ok:#5fd694}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{max-width:960px;margin:auto;padding:20px 16px 4px}
h1{margin:0;font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.05;letter-spacing:-.02em;font-weight:800}
h1 span{border-bottom:6px solid var(--sun)}
header p{margin:8px 0 0;color:var(--muted)}
main{max-width:960px;margin:auto;padding:8px 16px 110px}
h2.sec{font-size:1.15rem;margin:22px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips button,.pill{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px}
.chips button[aria-pressed=true],.pill[aria-pressed=true]{background:var(--brand);color:var(--on);border-color:var(--brand)}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.row .tile{flex:none;width:150px;scroll-snap-align:start}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px}
.art{aspect-ratio:16/10;border-radius:12px;overflow:hidden;position:relative;display:grid;place-items:center;background:hsl(var(--h) 45% 32%);color:#fff;font-size:2rem;font-weight:800}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art em{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font:.7rem/1 inherit;padding:4px 6px;border-radius:6px;font-style:normal}
.t{font-weight:700;font-size:.92rem;line-height:1.2}
.m{color:var(--muted);font-size:.8rem}
input[type=search],input[type=text],select{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.box label{display:flex;gap:10px;align-items:center;margin:8px 0}
.box input[type=checkbox]{width:20px;height:20px}
.empty{color:var(--muted);text-align:center;padding:36px 0}
.act{background:var(--brand);color:var(--on);border:0;border-radius:10px;padding:9px 14px}
.act.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
a.btn{display:inline-block;background:var(--brand);color:var(--on);text-decoration:none;padding:8px 12px;border-radius:10px;font-size:.88rem}
a.btn small{opacity:.8}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;background:none;border:0;padding:9px 4px 8px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem}
nav button[aria-current=page]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--sun)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
dialog{border:0;padding:0;background:var(--bg);color:var(--ink);width:min(720px,100%);max-height:100dvh;height:100dvh;margin:0 auto;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.stage{background:#0d1226;aspect-ratio:16/9;display:grid;place-items:center;position:relative}
.stage video{width:100%;height:100%}
.stage audio{width:100%;align-self:end}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:relative;width:62px;height:62px;border-radius:50%;background:var(--sun);color:#18203f;border:0;font-size:1.5rem}
.dbody{padding:14px 16px 40px}
.dbody h3{margin:0 0 2px;font-size:1.25rem}
.lbl{font-size:.8rem;color:var(--muted);margin:14px 0 6px}
.wrap{display:flex;gap:8px;flex-wrap:wrap}
.close{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:#0d1226}
.close button{background:none;border:1px solid #fff5;color:#fff;border-radius:10px;padding:6px 14px}
.eps button{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.eps button[aria-current=true]{border-color:var(--sun);border-width:2px}
</style>
</head>
<body>
<header>
  <h1><span>LocalPulse</span></h1>
  <p id="hello">Local videos, series and music. Watch for less data.</p>
</header>
<main id="main"></main>

<nav aria-label="Main"><div>
  <button data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Home</button>
  <button data-v="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</button>
  <button data-v="downloads"><svg viewBox="0 0 24 24"><path d="M12 4v11m-5-4l5 5 5-5M5 20h14"/></svg>Downloads</button>
  <button data-v="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>My account</button>
</div></nav>

<dialog id="dlg" aria-label="Player"></dialog>

<script>
const $ = s => document.querySelector(s);
const main = $('#main'), dlg = $('#dlg');
const CATS = ['Music','Movies','Series','Comedy','Gospel','Sports','Documentaries','Kids'];
const QUALS = [['low','Low'],['mid','Mid'],['high','HD']];
const store = {
  get(k,d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const S = { saver: store.get('saver', true), name: store.get('name','') };
let items = [], view = 'home', cat = 'All', q = '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = mb => !mb ? '' : mb >= 1 ? mb.toFixed(1) + ' MB' : Math.round(mb*1024) + ' KB';
const cats = () => [...CATS.filter(c => items.some(i => i.category === c)), ...new Set(items.map(i => i.category).filter(c => c && !CATS.includes(c)))];

fetch('content.json', {cache:'no-cache'}).then(r => r.json()).catch(() => []).then(d => { items = d; route(); });

/* ---------- routing ---------- */
function route(){
  const h = location.hash.slice(1);
  view = ['home','search','downloads','account'].includes(h) ? h : 'home';
  document.querySelectorAll('nav button').forEach(b => b.dataset.v === view ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  $('#hello').textContent = S.name ? 'Hi ' + S.name + ', what are we watching?' : 'Local videos, series and music. Watch for less data.';
  ({home, search, downloads, account})[view]();
  scrollTo(0,0);
}
addEventListener('hashchange', route);
document.querySelectorAll('nav button').forEach(b => b.onclick = () => location.hash = b.dataset.v);

/* ---------- tiles ---------- */
function tile(i){
  const b = document.createElement('button'); b.className = 'tile';
  const hue = ((cats().indexOf(i.category) + 1) * 53) % 360;
  b.innerHTML = `<span class="art" style="--h:${hue}">${i.thumb ? `<img src="${esc(i.thumb)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}<b>${esc(i.title[0])}</b>${i.episodes ? `<em>${i.episodes.length} episodes</em>` : `<em>${i.type === 'audio' ? 'Audio' : 'Video'}</em>`}</span><span class="t">${esc(i.title)}</span><span class="m">${esc(i.artist || i.category)}</span>`;
  b.onclick = () => openItem(i, 0, false);
  return b;
}
function fill(el, list){ list.forEach(i => el.appendChild(tile(i))); }
const emptyMsg = t => `<p class="empty">${t}</p>`;

/* ---------- views ---------- */
function home(){
  const list = cats();
  main.innerHTML = `<div class="chips">${['All', ...list].map(c => `<button data-cat="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join('')}</div><div id="body"></div>`;
  const body = $('#body');
  if (!items.length) body.innerHTML = emptyMsg('No content yet. Add items to content.json.');
  else if (cat === 'All') list.forEach(c => {
    body.insertAdjacentHTML('beforeend', `<h2 class="sec">${esc(c)}</h2><div class="row"></div>`);
    fill(body.lastElementChild, items.filter(i => i.category === c));
  });
  else { const g = document.createElement('div'); g.className = 'grid'; fill(g, items.filter(i => i.category === cat)); body.appendChild(g); }
  main.querySelector('.chips').onclick = e => { const c = e.target.closest('[data-cat]'); if (c){ cat = c.dataset.cat; home(); } };
}

function search(){
  main.innerHTML = `<input type="search" id="sq" placeholder="Search titles, artists, categories" aria-label="Search" value="${esc(q)}"><div class="grid" id="res" style="margin-top:14px"></div>`;
  const run = () => {
    const t = q.trim().toLowerCase(), res = $('#res'); res.innerHTML = '';
    const list = t ? items.filter(i => (i.title + ' ' + (i.artist||'') + ' ' + i.category).toLowerCase().includes(t)) : items;
    list.length ? fill(res, list) : res.innerHTML = emptyMsg('Nothing found. Try another word.');
  };
  $('#sq').oninput = e => { q = e.target.value; run(); };
  run(); $('#sq').focus();
}

function downloads(){
  const d = store.get('dl', []), total = d.reduce((a,x) => a + (x.mb||0), 0);
  main.innerHTML = `<h2 class="sec">Your downloads</h2>` + (d.length ? `
    <p class="m">${d.length} file${d.length>1?'s':''} · about ${fmt(total)} used. Files are saved by your browser in its Downloads folder.</p>
    <div class="box">${d.map(x => `<div class="li"><div><div class="t">${esc(x.t)}</div><div class="m">${esc(x.l)} · ${fmt(x.mb)} · ${new Date(x.ts).toLocaleDateString()}</div></div><a class="btn" href="${esc(x.url)}" download>Again</a></div>`).join('')}</div>
    <button class="act ghost" id="clr">Clear list</button>` : emptyMsg('Nothing downloaded yet. Open any video or song and tap MP4 or MP3.'));
  const c = $('#clr'); if (c) c.onclick = () => { store.set('dl', []); downloads(); };
}

function account(){
  const d = store.get('dl', []);
  main.innerHTML = `<h2 class="sec">My account</h2>
  <div class="box"><label for="nm" class="m">Your name</label><input type="text" id="nm" value="${esc(S.name)}" placeholder="Enter your name" autocomplete="given-name">
    <label><input type="checkbox" id="sv" ${S.saver ? 'checked' : ''}> Data saver: start videos in Low quality</label>
    <p class="m" style="margin:4px 0 0">With data saver off, videos start in HD. You can change quality on any video.</p></div>
  <div class="box"><div class="t">Activity</div><p class="m" style="margin:4px 0 10px">${d.length} downloads · about ${fmt(d.reduce((a,x)=>a+(x.mb||0),0)) || '0 MB'}</p>
    <button class="act ghost" id="rst">Reset my data</button></div>
  <p class="m">Your name and settings are saved on this device only. There is no sign-in on this site.</p>`;
  $('#nm').oninput = e => { S.name = e.target.value.trim(); store.set('name', S.name); $('#hello').textContent = S.name ? 'Hi ' + S.name + ', what are we watching?' : 'Local videos, series and music. Watch for less data.'; };
  $('#sv').onchange = e => { S.saver = e.target.checked; store.set('saver', S.saver); };
  $('#rst').onclick = () => { if (confirm('Clear your name, settings and download list?')){ ['name','saver','dl'].forEach(k => { try{ localStorage.removeItem(k); }catch(e){} }); S.name = ''; S.saver = true; account(); } };
}

/* ---------- player ---------- */
function openItem(item, ep, autoplay){
  const p = item.episodes ? { ...item, ...item.episodes[ep], title: item.title + ' · ' + item.episodes[ep].title } : item;
  const isVideo = p.type !== 'audio';
  const avail = QUALS.filter(([k]) => p[k]);
  let sel = isVideo && avail.length ? (S.saver ? avail[0][0] : avail[avail.length-1][0]) : null;

  dlg.innerHTML = `<div class="close"><button id="x">Close</button></div>
    <div class="stage" id="stage">${p.thumb ? `<img src="${esc(p.thumb)}" alt="" onerror="this.remove()">` : ''}<button class="play" aria-label="Play">&#9654;</button></div>
    <div class="dbody">
      <h3>${esc(p.title)}</h3><div class="m">${esc(item.artist || '')} ${item.category ? '· ' + esc(item.category) : ''} ${p.duration ? '· ' + esc(p.duration) : ''}</div>
      ${isVideo && avail.length ? `<div class="lbl">Watch in</div><div class="wrap" id="qs">${avail.map(([k,n]) => `<button class="pill" data-q="${k}" aria-pressed="${k === sel}">${n} <small>${fmt(p[k+'MB'])}</small></button>`).join('')}</div>` : ''}
      <div class="lbl">Download</div>
      <div class="wrap" id="dls">${avail.map(([k,n]) => `<a class="btn" href="${esc(p[k])}" download data-t="${esc(p.title)}" data-l="MP4 ${n}" data-mb="${p[k+'MB']||0}">MP4 ${n} <small>${fmt(p[k+'MB'])}</small></a>`).join('')}${p.mp3 ? `<a class="btn" href="${esc(p.mp3)}" download data-t="${esc(p.title)}" data-l="MP3" data-mb="${p.mp3MB||0}">MP3 <small>${fmt(p.mp3MB)}</small></a>` : ''}</div>
      ${item.episodes ? `<div class="lbl">Episodes</div><div class="eps">${item.episodes.map((e,n) => `<button data-ep="${n}" ${n === ep ? 'aria-current="true"' : ''}>${esc(e.title)} ${e.duration ? '<span class="m">· ' + esc(e.duration) + '</span>' : ''}</button>`).join('')}</div>` : ''}
    </div>`;

  const stage = $('#stage');
  const start = () => {
    const m = document.createElement(isVideo ? 'video' : 'audio');
    m.controls = true; m.autoplay = true; m.preload = 'none'; m.playsInline = true;
    if (p.thumb && isVideo) m.poster = p.thumb;
    m.src = isVideo ? p[sel] : p.mp3;
    stage.innerHTML = ''; stage.appendChild(m);
  };
  stage.querySelector('.play').onclick = start;
  if (autoplay) start();

  $('#x').onclick = () => dlg.close();
  const qs = $('#qs');
  if (qs) qs.onclick = e => {
    const b = e.target.closest('[data-q]'); if (!b) return;
    sel = b.dataset.q;
    qs.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    const m = stage.querySelector('video'); if (!m) return;
    const t = m.currentTime, was = !m.paused;
    m.src = p[sel];
    m.addEventListener('loadedmetadata', () => { m.currentTime = t; if (was) m.play(); }, {once:true});
    m.load();
  };
  $('#dls').onclick = e => {
    const a = e.target.closest('a'); if (!a) return;
    const d = store.get('dl', []);
    d.unshift({ t:a.dataset.t, l:a.dataset.l, mb:+a.dataset.mb, url:a.getAttribute('href'), ts:Date.now() });
    store.set('dl', d.slice(0, 100));
  };
  dlg.querySelectorAll('[data-ep]').forEach(b => b.onclick = () => openItem(item, +b.dataset.ep, true));
  if (!dlg.open) dlg.showModal();
}
dlg.addEventListener('close', () => { dlg.innerHTML = ''; if (view === 'downloads') downloads(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
